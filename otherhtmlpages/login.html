<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../othercsspages/login.css">
    <title>Login</title>
</head>
<body>
    

    <main class="login-page">

         <img class="login-background" src="../images/imgi_13_trello-left.fd2ac4a6.png" alt="">
         <img class="login-background-right" src="../images/imgi_14_trello-right.8236b2f3.png" alt="">

         <div class="login-card">

             <div class="login-container">

                <div class="logo">
                      <img src="../images/login logo.png" alt="">
                </div>

                <h2 class="login-title">Log in to continue</h2>

                <div class="email-section">

                    <label for="email">Email*</label>

                    <input type="email" id="email" name="email" placeholder="Enter your email">

                </div>

                <div class="remember-me">

                    <input type="checkbox" id="remember">

                    <label for="remember">Remember me</label>

                    <span class="info-icon">i</span>

                </div>

                <button type="button" class="continue-btn">Continue</button>

                <p class="continue-text">Or login with:</p>

                <button type="button" class="social-btn passkey-btn">
                       <span class="passkey-icon"><img src="../images/imgi_1_key-logo.6d28e5f0.png" alt="Passkey"></span>
                       <span>Passkey</span>
                </button>

                <p class="continue-text">Or continue with:</p>

                <button type="button" class="social-btn google-btn">
                       <span class="google-icon"><img src="../images/imgi_1_google-logo.5462b711.png" alt="Google"></span>
                       <span>Google</span>
                </button>

                <button type="button" class="social-btn microsoft-btn">
                       <img src="../images/imgi_2_microsoft-logo.c73d8dca.png" alt="Microsoft">
                       <span>Microsoft</span>
                </button>

                <button type="button" class="social-btn apple-btn">
                       <img src="../images/imgi_3_apple-logo.23825a4f.png" alt="Apple">
                       <span>Apple</span>
                </button>

                 <button type="button" class="social-btn slack-btn">
                       <img src="../images/imgi_4_slack-logo.9621bf1a.png" alt="Slack">
                       <span>Slack</span>
                </button>

                <div class="account-links">

                    <a href="#">Can't log in?</a>

                    <span>•</span>

                    <a href="#">Create an account</a>

                </div>

                <div class="login-footer">

                    <img src="../images/logo gray.png" alt="">

                    <div class="footer-links">
                        <a href="#">one account</a>
                        <img class="external-icon" src="../images/box arrow.png" alt="" width="19px">
                        <span>for Jira, Confluence, Trello and more.</span>
                    </div>
                      
                    <div class="privacy-links">
                        <a href="#">Privacy Policy</a>
                        <img class="external-icon" src="../images/box arrow.png" alt="" width="19px">
                        <span>•</span>
                        <a href="#">User Notice</a>
                        <img class="external-icon" src="../images/box arrow.png" alt="" width="19px">
                    </div>

                </div>

             </div>
         </div>
    </main>
</body>
</html>
